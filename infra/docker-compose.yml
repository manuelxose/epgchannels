services:
  mongo:
    image: mongo:7
    container_name: tdt-api01-mongo
    # Replica set enabled: transactions and change streams stay available, and the
    # driver connects through the host-published address only.
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27117"]
    ports:
      - "127.0.0.1:27117:27117"
    volumes:
      - ./.data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--port", "27117", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: initiates the replica set with the *host-published* address.
  # Advertising the container DNS name "mongo" would redirect a host client to a
  # name that does not resolve outside the compose network.
  mongo-init:
    image: mongo:7
    container_name: tdt-api01-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --quiet
      - --port
      - "27117"
      - --host
      - mongo
      - --eval
      - >-
        try { rs.status() }
        catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27117' }] }) }

  redis:
    image: redis:7-alpine
    container_name: tdt-api01-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--port", "27118"]
    ports:
      - "127.0.0.1:27118:27118"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "27118", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
